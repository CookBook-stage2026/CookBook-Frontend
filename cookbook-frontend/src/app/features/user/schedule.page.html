<app-toast></app-toast>

<div class="page-header">
  <div class="header-content">
    <h1>Your Week Schedule</h1>
    <p class="subtitle">Plan your meals for the week ahead</p>
  </div>
  <button
    mat-flat-button
    class="create-btn"
    (click)="openCreateModal()"
  >
    <mat-icon>add</mat-icon>
    Create New Schedule
  </button>
</div>

<div class="schedule-container">
  <div class="week-navigator">
    <button
      mat-icon-button
      (click)="previousWeek()"
      [attr.aria-label]="'Previous week'"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>
    <span class="week-range" aria-live="polite">{{ weekRangeLabel() }}</span>
    <button
      mat-icon-button
      (click)="nextWeek()"
      [attr.aria-label]="'Next week'"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <app-week-schedule-view
    [weekStartDate]="selectedWeekStart()"
    [refreshTrigger]="refreshSignal()"
    (editSchedule)="openEditModal($event)"
  />
</div>

@if (isCreateModalOpen()) {
  <dialog
    class="modal-overlay"
    (click)="closeCreateModal()"
    (keydown.esc)="closeCreateModal()"
    aria-modal="true"
    [attr.aria-label]="editingSchedule() ? 'Edit schedule' : 'Create schedule'"
  >
    <div
      class="modal-container"
      (click)="$event.stopPropagation()"
      (keydown.esc)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h3>{{ editingSchedule() ? 'Edit Schedule' : 'Create Schedule' }}</h3>
        <button
          mat-icon-button
          (click)="closeCreateModal()"
          class="close-btn"
          [attr.aria-label]="'Close modal'"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <app-week-schedule-create
        [existingSchedule]="editingSchedule()"
        [weekStartDate]="selectedWeekStart()"
        (closeModal)="closeCreateModal()"
        (scheduleCreated)="onScheduleCreated()"
      />
    </div>
  </dialog>
}
