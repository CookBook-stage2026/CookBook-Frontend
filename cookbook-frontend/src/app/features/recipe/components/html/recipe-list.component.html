<div class="list-container">
  <div class="list-header">
    <nav class="pagination" aria-label="Recipe pagination">
      <button mat-stroked-button (click)="onPrevPage()" [disabled]="isPrevDisabled()">Prev</button>
      <span class="page-info" aria-live="polite">Page {{ displayPage() }} / {{ displayTotalPages() }}</span>
      <button mat-stroked-button (click)="onNextPage()" [disabled]="isNextDisabled()">Next</button>
    </nav>

    <div class="sort-group">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="compact-dropdown">
        <mat-select [value]="sortBy()" (selectionChange)="onSortFieldChange($event.value)">
          <mat-option value="name">Name</mat-option>
          <mat-option value="duration">Duration</mat-option>
          <mat-option value="user">Creator</mat-option>
        </mat-select>
      </mat-form-field>

      <button
        mat-icon-button
        color="primary"
        type="button"
        (click)="onToggleDirection()"
        class="compact-icon-btn"
        title="Toggle Sort Direction">
        <mat-icon>{{ sortDirection() === 'asc' ? 'arrow_downward' : 'arrow_upward' }}</mat-icon>
      </button>
    </div>
  </div>

  @if (isLoading()) {
    <div class="status-msg" aria-live="polite">Loading recipes...</div>
  } @else if (recipes().length === 0) {
    <div class="status-msg" aria-live="polite">No recipes found.</div>
  } @else {
    <ul class="grid">
      @for (recipe of recipes(); track recipe.id) {
        <li>
          <app-recipe-card [recipe]="recipe" />
        </li>
      }
    </ul>
  }
</div>
