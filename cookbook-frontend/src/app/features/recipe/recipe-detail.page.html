<div class="page-container">
  @if (recipe.isLoading()) {
    <div class="loading-shade">
      <mat-spinner aria-label="Loading recipe"/>
    </div>
  } @else if (recipe.error()) {
    <p role="alert">Could not load recipe. Please try again.</p>
  } @else if (recipe.value(); as r) {

    @if (isCookingMode()) {
      <app-recipe-cooking-mode
        [recipe]="r"
        (exit)="exitCookingMode()"/>
    } @else {
      <button mat-icon-button (click)="location.back()" aria-label="Back to schedule">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <header class="page-header">
        <div>
          <h1 class="page-title">{{ r.name }}</h1>
          <mat-chip-set class="recipe-chips" aria-label="Recipe metadata">
            <mat-chip disabled class="static-chip">
              <mat-icon matChipAvatar>schedule</mat-icon>
              {{ r.durationInMinutes }} min
            </mat-chip>
            <mat-chip disabled class="static-chip">
              <mat-icon matChipAvatar>people</mat-icon>
              {{ r.servings }} servings
            </mat-chip>
          </mat-chip-set>
        </div>
        <div class="header-actions">
          <button
            mat-flat-button
            color="accent"
            (click)="enhanceRecipe()"
            [disabled]="enhancedRecipe.isLoading()"
          >
            @if (enhancedRecipe.isLoading()) {
              <mat-spinner diameter="20" aria-hidden="true"/>
            } @else {
              <mat-icon aria-hidden="true">auto_awesome</mat-icon>
            }

            @if (!enhancedRecipe.isLoading()) {
              <span>Enhance Recipe</span>
            }
          </button>

          <button mat-flat-button color="primary" (click)="enterCookingMode()">
            <mat-icon>restaurant</mat-icon>
            Start Cooking
          </button>
        </div>
      </header>

      <mat-divider/>

      <app-recipe-ingredients-list [ingredients]="r.ingredients"/>

      <mat-divider/>

      <app-recipe-preparation-list [steps]="r.steps"/>
    }
  }
</div>
