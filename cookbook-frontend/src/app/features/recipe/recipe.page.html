<app-toast />

<div class="page-container">
  <header class="page-header">
    <div>
      <h1 class="page-title">Recipes</h1>
      <p class="page-subtitle">Your personal culinary collection.</p>
    </div>

    <div class="header-actions">
      <button
        mat-stroked-button
        type="button"
        (click)="toggleScope()"
        [color]="includeAccessibleRecipes() ? 'primary' : ''"
        [attr.aria-pressed]="includeAccessibleRecipes()">
        <mat-icon>{{ includeAccessibleRecipes() ? 'groups' : 'person' }}</mat-icon>
        {{ includeAccessibleRecipes() ? 'All Households' : 'Own Recipes Only' }}
      </button>

      <button
        mat-stroked-button
        type="button"
        (click)="togglePreferences()"
        [color]="shouldApplyPreferences() ? 'primary' : ''"
        [attr.aria-pressed]="shouldApplyPreferences()">
        <mat-icon>{{ shouldApplyPreferences() ? 'visibility' : 'visibility_off' }}</mat-icon>
        {{ shouldApplyPreferences() ? 'Using preferences' : 'Ignoring preferences' }}
      </button>

      <button
        mat-flat-button
        type="button"
        (click)="openImportDialog()">
        <mat-icon>download</mat-icon>
        Import recipe
      </button>

      <button
        mat-flat-button
        color="primary"
        type="button"
        (click)="openModal()">
        <mat-icon>add</mat-icon>
        Add recipe
      </button>
    </div>
  </header>

  <app-recipe-filter (selectedIngredientsChange)="onFilterChange($event)"/>

  <mat-divider class="section-divider"/>

  <app-recipe-list
    [recipes]="recipes()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [totalPages]="totalPages()"
    [isLoading]="isLoading()"
    [sortBy]="sortBy()"
    [sortDirection]="sortDirection()"
    (pageChange)="onPageChange($event)"
    (sortFieldChange)="onSortFieldChange($event)"
    (sortDirectionChange)="toggleSortDirection()"
    (retryClick)="onRetry()"/>
</div>

<app-recipe-form-modal
  [isOpen]="isCreateModalOpen()"
  (closeModal)="closeModal()"
  (recipeSaved)="onRecipeCreated()"/>
