name: Angular CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "development" ]
  # This below is temporary
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./cookbook-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build:prod

  docker-github:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/cookbook-stage2026/cookbook-frontend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          context: ./cookbook-frontend

  docker-aws:
    runs-on: ubuntu-latest
    needs: build
    # if: github.event_name == 'push' && github.ref_name == 'development'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cookbook/frontend:latest
          context: ./cookbook-frontend

      - name: Zip deploy files
        run: |
          cd deploy-files
          zip -r ../${{ github.run_id }}.zip .

      - name: Deploy
        env:
          ELASTIC_BEANSTALK_NAME: CookBook
          ELASTIC_BEANSTALK_ENV_NAME: CookBook-env
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp "${{ github.run_id }}.zip" s3://elasticbeanstalk-$AWS_REGION-$AWS_ACCOUNT_ID/deploy-files/
          aws elasticbeanstalk create-application-version \
            --application-name $ELASTIC_BEANSTALK_NAME \
            --version-label ${{ github.run_id }} \
            --description ${{ github.run_id }} \
            --source-bundle S3Bucket="elasticbeanstalk-$AWS_REGION-$AWS_ACCOUNT_ID",S3Key="deploy-files/${{ github.run_id }}.zip"
          aws elasticbeanstalk update-environment \
            --application-name $ELASTIC_BEANSTALK_NAME \
            --environment-name $ELASTIC_BEANSTALK_ENV_NAME \
            --version-label ${{ github.run_id }}
          aws elasticbeanstalk wait environment-updated \
            --application-name $ELASTIC_BEANSTALK_NAME \
            --environment-name $ELASTIC_BEANSTALK_ENV_NAME